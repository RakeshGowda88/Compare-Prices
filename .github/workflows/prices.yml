name: Collect prices
on:
  schedule:
    - cron: '0 20 * * *'   # daily, about 6-7am Sydney time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect-prices.mjs
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git pull --rebase && git push)
